server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # proxy GraphQL requests to the backend API container
    location /graphql {
        proxy_pass http://server:3000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # proxy REST endpoints (e.g. healthcheck) to the backend API container
    location /api/ {
        proxy_pass http://server:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # serve the SPA, falling back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
