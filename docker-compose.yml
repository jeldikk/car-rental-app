services:
  mongo_db:
    image: mongo:8.3.11-noble
    container_name: mongo_db_container
    restart: always
    ports:
      - "37017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
  mongo_express:
    image: mongo-express:latest
    container_name: mongo_express_container
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://root:root@mongo_db:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=root
      - ME_CONFIG_BASICAUTH_PASSWORD=root
      - ME_CONFIG_BASICAUTH_ENABLED=true
    depends_on:
      mongo_db:
        condition: service_healthy
  server:
    build:
      context: ./server
    container_name: server_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MONGO_URI=mongodb://root:root@mongo_db:27017/car-rental-app?authSource=admin
    depends_on:
      mongo_db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
    container_name: frontend_container
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo-data:
    driver: local
